<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project - SPD Contracting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../assets/css/base.css">
  <link rel="stylesheet" href="../../assets/css/layout.css">
  <link rel="stylesheet" href="../../assets/css/components.css">
  <link rel="stylesheet" href="../../assets/css/navbar.css">
  <link rel="stylesheet" href="../../assets/css/carousel.css">
  <link rel="stylesheet" href="../../assets/css/pages.css">
  <link rel="stylesheet" href="../../assets/css/project.css">
</head>
<body class="page-project">
  <div id="site-header-placeholder"></div>

  <main id="main-content" class="project-main">
    <section class="project-hero" id="project-hero" aria-label="Project hero">
      <div class="project-hero__overlay" aria-hidden="true"></div>
      <div class="project-hero__content">
        <p class="project-hero__category"></p>
        <h1 class="project-hero__title"></h1>
      </div>
    </section>

    <div class="container">
      <section class="project-overview" id="project-overview" aria-label="Project overview">
        <div class="project-overview__grid"></div>
      </section>

      <section class="project-gallery content-section" aria-label="Gallery">
        <h2 class="section-title">Gallery</h2>
        <div class="c-carousel" data-carousel data-carousel-loop="true" data-carousel-dots="false" data-carousel-breakpoints='{"0":1,"600":2,"900":3}' aria-label="Project gallery">
          <div class="c-carousel__viewport">
            <div class="c-carousel__track" id="project-gallery-track"></div>
          </div>
          <button class="c-carousel__btn c-carousel__btn--prev" type="button" aria-label="Previous"></button>
          <button class="c-carousel__btn c-carousel__btn--next" type="button" aria-label="Next"></button>
          <div class="c-carousel__dots" aria-label="Pagination"></div>
        </div>
      </section>

      <section class="project-related content-section" aria-label="Related Projects">
        <h2 class="section-title">Related Projects</h2>
        <div class="c-carousel" data-carousel data-carousel-loop="true" data-carousel-dots="false" data-carousel-breakpoints='{"0":1,"768":2}' aria-label="Related projects">
          <div class="c-carousel__viewport">
            <div class="c-carousel__track" id="project-related-track"></div>
          </div>
          <button class="c-carousel__btn c-carousel__btn--prev" type="button" aria-label="Previous"></button>
          <button class="c-carousel__btn c-carousel__btn--next" type="button" aria-label="Next"></button>
          <div class="c-carousel__dots" aria-label="Pagination"></div>
        </div>
      </section>
    </div>
  </main>

  <div id="site-footer-placeholder"></div>

  <script src="../../assets/js/projects-data.js"></script>
  <script src="../../assets/js/project-page.js"></script>
  <script src="../../assets/js/carousel.js"></script>
  <script src="../../assets/js/navbar.js"></script>
  <script src="../../assets/js/main.js" data-partials-base="../../partials/"></script>
</body>
</html>
